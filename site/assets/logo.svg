<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d13"/>
      <stop offset="50%" stop-color="#06150e"/>
      <stop offset="100%" stop-color="#020905"/>
    </linearGradient>

    <!-- Gradiente Principal Esmeralda / Guarani -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Gradiente de Destaque Menta / Ciano -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Brilho Suave e Sem Cortes (Margem Ampla x/y -150% e width/height 400%) -->
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Sombra Sutil sem Truncamento Vertical -->
    <filter id="dropShadow" x="-150%" y="-150%" width="400%" height="400%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo Squircle Suave -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Símbolo Guarani: Broto Vegetal de Acessibilidade / Pavilhão de Escuta Orgânica -->
  <!-- Centralizado perfeitamente no canvas 512x512 -->
  <g transform="translate(256, 256) scale(1.52) translate(-177, -250)" filter="url(#dropShadow)">
    <!-- Pavilhão de Escuta / Folha Envolvente -->
    <path d="M 170,350 C 130,310 110,250 135,190 C 155,140 205,135 225,185 C 240,225 210,270 175,285 C 160,290 155,305 168,318 C 185,335 215,330 230,315" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glow)"/>
    
    <!-- Nervura Orgânica Central da Folha -->
    <path d="M 148,220 C 175,200 200,215 190,245" 
          fill="none" 
          stroke="#6ee7b7" 
          stroke-width="11" 
          stroke-linecap="round"/>

    <!-- Pupila / Ponto de Atenção com respiro perfeitamente balanceado -->
    <circle cx="171" cy="235" r="14" fill="#38bdf8"/>
  </g>
</svg>
