<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081810"/>
      <stop offset="60%" stop-color="#040d08"/>
      <stop offset="100%" stop-color="#010503"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f291c"/>
      <stop offset="100%" stop-color="#07170f"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Fundo Total 1200x630 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Guias Visuais / Sangrias de Proteção GOST (Sutileza Estética) -->
  <line x1="200" y1="0" x2="200" y2="630" stroke="#10b981" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4,8"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="#10b981" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4,8"/>

  <!-- Card Principal do Miolo Útil (800x500 centrado) -->
  <rect x="220" y="75" width="760" height="480" rx="24" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Selos de Identificação -->
  <rect x="260" y="105" width="130" height="28" rx="6" fill="#047857"/>
  <text x="325" y="124" text-anchor="middle" font-family="monospace, monospace" font-size="12" font-weight="bold" fill="#ecfdf5" letter-spacing="1.5">
    ★ GOST 1.5.0
  </text>

  <rect x="400" y="105" width="160" height="28" rx="6" fill="#1e293b"/>
  <text x="480" y="124" text-anchor="middle" font-family="monospace, monospace" font-size="12" font-weight="bold" fill="#38bdf8" letter-spacing="1">
    ACESSIBILIDADE
  </text>

  <rect x="570" y="105" width="160" height="28" rx="6" fill="#1e293b"/>
  <text x="650" y="124" text-anchor="middle" font-family="monospace, monospace" font-size="12" font-weight="bold" fill="#a7f3d0" letter-spacing="1">
    AUTO-HOSPEDADO
  </text>

  <!-- Logotipo Oficial Hendu Integrado no Miolo -->
  <g transform="translate(260, 155)">
    <rect width="90" height="90" rx="22" fill="#06150e" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Símbolo Botânico Centrado sem ondas e com pupila balanceada -->
    <g transform="translate(45, 45) scale(0.28) translate(-177, -250)">
      <path d="M 170,350 C 130,310 110,250 135,190 C 155,140 205,135 225,185 C 240,225 210,270 175,285 C 160,290 155,305 168,318 C 185,335 215,330 230,315" 
            fill="none" stroke="url(#primaryGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <path d="M 148,220 C 175,200 200,215 190,245" 
            fill="none" stroke="#6ee7b7" stroke-width="11" stroke-linecap="round"/>
      <circle cx="171" cy="235" r="14" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Título e Pronúncia -->
  <text x="375" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#f8fafc" letter-spacing="4">
    HENDU
  </text>
  <text x="377" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#34d399" letter-spacing="1">
    [rren-DÚ] • Guarani: escutar, ouvir, compreender
  </text>

  <!-- Descrição Limpa e Acessível -->
  <text x="260" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0">
    Assistente de Acessibilidade para WhatsApp
  </text>
  <text x="260" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8">
    Transcreve mensagens de voz em texto legível e descreve fotos e figurinhas com IA especializada.
  </text>

  <!-- 3 Pilares em Destaque Visual -->
  <g transform="translate(260, 355)">
    <!-- Pilar 1 -->
    <rect x="0" y="0" width="215" height="90" rx="12" fill="#081810" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <text x="16" y="32" font-family="system-ui, sans-serif" font-size="18">🎙️</text>
    <text x="45" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">ÁUDIO → TEXTO</text>
    <text x="16" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Converte notas de voz em</text>
    <text x="16" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">texto legível instantâneo</text>

    <!-- Pilar 2 -->
    <rect x="230" y="0" width="215" height="90" rx="12" fill="#081810" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <text x="246" y="32" font-family="system-ui, sans-serif" font-size="18">🖼️</text>
    <text x="275" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">FOTOS &amp; MEMES</text>
    <text x="246" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Descreve imagens e decifra</text>
    <text x="246" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">o humor de figurinhas</text>

    <!-- Pilar 3 -->
    <rect x="460" y="0" width="220" height="90" rx="12" fill="#081810" stroke="#10b981" stroke-width="1" stroke-opacity="0.3"/>
    <text x="476" y="32" font-family="system-ui, sans-serif" font-size="18">🛡️</text>
    <text x="505" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">SOBERANO &amp; PRIVADO</text>
    <text x="476" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Auto-hospedado com modo</text>
    <text x="476" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">dona e custódia local</text>
  </g>

  <!-- Rodapé do Card -->
  <text x="260" y="495" font-family="monospace, monospace" font-size="11" fill="#6ee7b7" opacity="0.8">
    https://hendu.2lp.in • Software Livre sob licença GPL-3.0-or-later
  </text>
</svg>
